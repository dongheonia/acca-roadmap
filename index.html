<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>나의 ACCA 로드맵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: red ground, white level panels with card grids (exam/module), progress hero on top. */
:root{
  --bg:#b8231b; --bg-deep:#8f1913; --on-bg:#ffffff; --on-bg-muted:#f6d3cf;
  --surface:#ffffff; --card:#f3f1f0; --card-done:#e8f0ea; --ink:#1c1514; --muted:#6a5f5d; --line:#e5dedc;
  --red:#c0281e; --maroon:#6e1410; --pass:#2e7d3a; --pass-soft:#e2efe4; --study:#b26a00; --study-soft:#fbeed8;
  --gold:#f0b23e; --ring-track:rgba(255,255,255,.28);
  --f-display:"Bricolage Grotesque","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#5e1310; --bg-deep:#440d0b; --on-bg:#fff3f1; --on-bg-muted:#e9b9b3;
  --surface:#1f1716; --card:#2a2120; --card-done:#1d2a20; --ink:#f1e9e7; --muted:#b3a5a2; --line:#3a2e2c;
  --red:#e2483c; --maroon:#a3281f; --pass:#6cc27a; --pass-soft:#1f3a24; --study:#f0a640; --study-soft:#3a2a12;
  --gold:#f0b23e; --ring-track:rgba(255,255,255,.18); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#5e1310; --bg-deep:#440d0b; --on-bg:#fff3f1; --on-bg-muted:#e9b9b3;
  --surface:#1f1716; --card:#2a2120; --card-done:#1d2a20; --ink:#f1e9e7; --muted:#b3a5a2; --line:#3a2e2c;
  --red:#e2483c; --maroon:#a3281f; --pass:#6cc27a; --pass-soft:#1f3a24; --study:#f0a640; --study-soft:#3a2a12;
  --gold:#f0b23e; --ring-track:rgba(255,255,255,.18); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:1040px;margin:0 auto;padding-inline:20px;padding-block:28px 64px;display:flex;flex-direction:column;gap:24px}
h1,h2,h3{text-wrap:balance;margin:0}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}

/* hero */
.hero{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:20px;color:var(--on-bg)}
.hero .eyebrow{color:var(--on-bg-muted)}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,5.5vw,46px);letter-spacing:-.02em;line-height:1.1;margin-top:4px}
.who{font-size:13.5px;color:var(--on-bg-muted);margin-top:10px;line-height:1.6}
.who b{color:var(--on-bg);font-weight:500}
.sync{font-size:12px;color:var(--on-bg-muted);margin-top:4px}
.ring{position:relative;width:150px;height:150px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--on-bg)}
.ring .n{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.ring .n small{font-size:20px;color:var(--on-bg-muted)}
.ring .c{font-size:11px;letter-spacing:.14em;color:var(--on-bg-muted);margin-top:4px}

/* progress cards */
.progress{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pcard{background:var(--surface);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.pcard .eyebrow{color:var(--muted)}
.pcard .big{font-family:var(--f-display);font-weight:800;font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.pcard .big small{font-size:19px;color:var(--muted);font-weight:600}
.pcard .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line)}
.bar span{display:block;height:100%;transition:width .4s ease}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.next{font-size:13.5px;border-top:1px dashed var(--line);padding-top:10px}

/* tabs */
.tabs{display:flex;gap:4px;background:var(--bg-deep);border-radius:10px;padding:4px;width:fit-content;max-width:100%;flex-wrap:wrap}
.tabs button{font:inherit;font-size:14px;border:0;background:transparent;color:var(--on-bg-muted);padding:9px 16px;border-radius:7px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:700}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.topbar{display:flex;justify-content:flex-end;margin-bottom:-12px}
.lang{display:flex;gap:2px;background:var(--bg-deep);border-radius:999px;padding:3px}
.lang button{font:inherit;font-size:12.5px;border:0;background:transparent;color:var(--on-bg-muted);padding:5px 12px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700}

.note{font-size:13.5px;background:var(--bg-deep);color:var(--on-bg);border-radius:10px;padding:13px 16px;line-height:1.65}
.note b{color:var(--gold)}

/* level panels */
.panel{background:var(--surface);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:16px}
.phead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.phead h2{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.01em;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.panel > .phead:first-child{cursor:pointer}
.fold{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;margin-left:auto}
.fold svg{width:14px;height:14px;transition:transform .2s ease}
.panel.collapsed .fold svg{transform:rotate(180deg)}
.panel.collapsed > :not(:first-child){display:none}
.panel.collapsed{gap:0}
.phead .award{margin-left:auto}
.phead .award + .fold{margin-left:0}
.phead h2 .lv{font-family:var(--f-body);font-size:17px;font-weight:700;color:var(--red)}
.phead .sub{font-size:13px;color:var(--muted);width:100%;margin-top:-6px}
.award{display:flex;align-items:center;gap:14px;border-radius:999px;padding:8px 8px 8px 18px;background:var(--card);color:var(--ink);max-width:100%}
.award.got{background:linear-gradient(90deg,var(--red),var(--maroon));color:#fff}
.award .a1{font-size:11.5px;opacity:.85}
.award .a2{font-weight:700;font-size:14px}
.award .score{flex:none;width:52px;height:52px;border-radius:50%;background:var(--gold);color:#1c1514;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:13px;font-weight:500}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:var(--card);border-radius:12px;padding:0 16px 14px;display:flex;flex-direction:column;gap:8px;min-width:0;min-height:170px}
.card.done{background:var(--card-done)}
.card.dim{opacity:.6}
.tag{align-self:flex-start;font-size:11.5px;letter-spacing:.1em;font-weight:500;color:#fff;background:var(--red);padding:3px 9px;border-radius:0 0 5px 5px}
.tag.mod{background:var(--maroon)}
.card .t{font-weight:700;font-size:15px;line-height:1.35}
.card .s{font-size:12.5px;color:var(--muted);line-height:1.5}
.card .foot{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}
.chip{font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;white-space:nowrap;display:inline-flex;gap:5px;align-items:center}
.chip.done{background:var(--pass);color:#fff}
.chip.todo{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.chip.study{background:var(--study-soft);color:var(--study)}
.chip.cond{background:var(--surface);color:var(--muted);border:1px dashed var(--muted)}
select{font:inherit;font-size:12.5px;padding:4px 8px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;max-width:100%}
select.passed{border-color:var(--pass);color:var(--pass);font-weight:500}
select.studying{border-color:var(--study);color:var(--study);font-weight:500}
.optsel{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.foot-note{font-size:12px;color:var(--muted)}

/* ethics */
.units{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.unit{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:10px;background:var(--card);cursor:pointer;min-width:0}
.unit.done{background:var(--card-done)}
.unit input{width:18px;height:18px;accent-color:var(--pass);flex:none;cursor:pointer}
.unit .un{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:22px;flex:none}
.unit.done .ut{color:var(--muted);text-decoration:line-through}

/* table + timeline */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:540px}
th,td{text-align:left;padding:9px 12px;border-top:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:500;border-top:0}
td.arrow{color:var(--muted);width:20px}
tr.grp td{background:var(--card);font-weight:700;font-size:13px;padding-block:7px}
tr.grp .lv{color:var(--red)}
td .tsub{display:block;font-size:12px;color:var(--muted);font-weight:400}
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:128px 1fr;gap:14px;padding:10px 4px;border-top:1px solid var(--line);font-size:14px}
.tl:first-child{border-top:0}
.tl .d{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.tl.past{opacity:.5}
.tgrid{display:flex;flex-direction:column}
.tr{display:grid;grid-template-columns:120px minmax(0,1fr) minmax(0,1fr);border-top:1px solid var(--line);font-size:14px}
.tr > *{padding:11px 12px;min-width:0}
.tr > .tc + .tc{border-left:1px solid var(--line)}
.tr.thead{border-top:0;border-bottom:2px solid var(--ink)}
.tr.thead h3{font-size:15px;font-weight:700;display:flex;gap:8px;align-items:baseline}
.tr.thead h3 + h3{border-left:1px solid var(--line)}
.tr.thead h3 .lv{color:var(--red)}
.tr .d{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.tr.now{grid-template-columns:120px 1fr;background:var(--study-soft);border-radius:8px;border-top:0;margin-block:2px}
.tr.now .d{color:var(--study)}
.tr.now + .tr{border-top:0}
.tr.past{opacity:.5}
.tc{display:flex;flex-direction:column;gap:10px}
.ti .sub2{display:block;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-bottom:1px}
.ti .tt{display:block}
.ti .tn{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.ti.key .tt{font-weight:700;color:var(--red)}
.ti.ref .tt{color:var(--muted)}
.tc .empty{color:var(--line)}
@media (max-width:760px){
  .tr{grid-template-columns:1fr}
  .tr > *{padding:6px 4px}
  .tr > .tc + .tc{border-left:0}
  .tr .d{padding-top:12px}
  .tr.thead{display:none}
  .tr.now{grid-template-columns:auto 1fr;padding-inline:8px}
  .tc::before{content:"[" attr(data-who) "]";font-size:12px;font-weight:700;color:var(--red)}
  .tc:has(.empty){display:none}
}
.tl .tt{display:block}
.tl .tn{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.tl.key .tt{font-weight:700;color:var(--red)}
.tl.ref .tt{color:var(--muted)}
.tl.now{background:var(--study-soft);border-radius:8px;padding-inline:10px}
.tl.now .d{color:var(--study)}

.adv{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.adv table{min-width:440px}
.adv td.num,.adv th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:13px}
.adv tr.total td{font-weight:700;border-top:2px solid var(--ink)}
.adv td.hl,.adv th.hl{background:var(--pass-soft)}
.adv .tsub{display:block;font-size:12px;color:var(--muted);font-weight:400}
.save{background:var(--red);color:#fff;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:4px}
.save .amt{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1.05}
.save .s1{font-size:13.5px;opacity:.9}
.steps{display:flex;flex-direction:column;gap:8px}
@media (max-width:760px){.adv{grid-template-columns:1fr}}
footer{font-size:12.5px;color:var(--on-bg-muted);line-height:1.7}
footer a{color:var(--on-bg)}

@media (max-width:640px){
  .tl{grid-template-columns:96px 1fr;gap:10px}
  .progress{grid-template-columns:1fr}
  .units{grid-template-columns:1fr}
  .ring{width:120px;height:120px}
  .ring .n{font-size:36px}
  .panel{padding:16px}
  .award{border-radius:14px}
}
@media (prefers-reduced-motion:reduce){.bar span,.ring circle,.fold svg{transition:none}}
</style>

<div class="wrap">
  <div class="topbar">
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ko" aria-pressed="true">한국어</button>
      <button type="button" data-lang="en" aria-pressed="false">English</button>
    </div>
  </div>
  <header class="hero">
    <div>
      <div class="eyebrow" id="s-eyebrow">ACCA Qualification · 개인 트래커</div>
      <h1 id="s-title">나의 ACCA 로드맵</h1>
      <div class="who" id="s-who"><b>University of Exeter</b> · 2027 졸업 예정<br>BSc/BA (Hons) Accounting and Finance</div>
      <div class="sync" id="sync">진행 상황 불러오는 중…</div>
    </div>
    <div class="ring" id="ring"></div>
  </header>

  <div class="progress" id="progress"></div>

  <div class="tabs" role="tablist" aria-label="과목 체계" id="tabs">
    <button role="tab" id="tab-new" aria-selected="true">신규 체계 · 2027년 9월부터</button>
    <button role="tab" id="tab-cur" aria-selected="false">현행 체계 · 2027년 6월까지</button>
  </div>

  <div id="view" style="display:flex;flex-direction:column;gap:20px"></div>

  <section class="panel" id="ethics" data-key="ethics"></section>

  <section class="panel" data-key="map">
    <div class="phead"><h2 id="s-map">현행 → 신규 대응표</h2></div>
    <div class="phead"><span class="sub" style="margin-top:-12px" id="s-mapsub">합격·면제는 신청 없이 자동으로 이월됩니다</span></div>
    <div class="tablewrap"><table>
      <thead id="s-maphead"><tr><th>현행</th><th></th><th>2027년 신규</th><th>내 상태</th></tr></thead>
      <tbody id="maptable"></tbody>
    </table></div>
  </section>

  <section class="panel" data-key="timeline">
    <div class="phead"><h2 id="s-tl">주요 일정</h2><span class="foot-note" id="today"></span></div>
    <div class="tgrid" id="timeline"></div>
  </section>

  <section class="panel" id="advantage" data-key="advantage"></section>

  <footer id="s-footer"></footer>
</div>

<script>
const TODAY = new Date();

// ---- language: per-device preference ----
let lang = "ko";
try{ if(localStorage.getItem("acca-lang")==="en") lang="en"; }catch(e){}
const t = (ko,en) => lang==="en"?en:ko;
const L = x => Array.isArray(x) ? t(x[0],x[1]) : x;   // [ko, en] pair or plain string
const fmtDate = d => d.toLocaleDateString(t("ko-KR","en-GB"), lang==="en"?{day:"numeric",month:"short",year:"numeric"}:undefined);
const BRACKET = [["[초급]","[Basic]"],["[중급]","[Intermediate]"],["[고급]","[Advanced]"]];

// ---- static data ----
// current system; ex = exempt via Exeter degree
const CUR = [
  {lv:0, name:"Applied Knowledge", items:[
    {c:"BT", n:"Business and Technology", ex:true},
    {c:"MA", n:"Management Accounting", ex:true},
    {c:"FA", n:"Financial Accounting", ex:true},
  ]},
  {lv:1, name:"Applied Skills", items:[
    {c:"LW", n:"Corporate and Business Law", ex:true},
    {c:"PM", n:"Performance Management", ex:true, cond:"BEA1009/INT1009 + BEA2017 + BEA3017"},
    {c:"TX", n:"Taxation", ex:true, cond:"BEA2002"},
    {c:"FR", n:"Financial Reporting", ex:true, cond:"BEA2019 + BEA2020 + BEA3020"},
    {c:"AA", n:"Audit and Assurance", ex:true, cond:"BEA3022"},
    {c:"FM", n:"Financial Management", ex:true, cond:"BEA2018 + BEA3018"},
  ]},
  {lv:2, name:"Strategic Professional", items:[
    {c:"SBL", n:"Strategic Business Leader"},
    {c:"SBR", n:"Strategic Business Reporting"},
    {slot:0}, {slot:1},
    {mod:"EPSM", n:"Ethics and Professional Skills Module"},
  ]},
];
const CUR_OPTS = [
  {c:"AFM", n:"Advanced Financial Management"},
  {c:"APM", n:"Advanced Performance Management"},
  {c:"ATX", n:"Advanced Taxation (UK)"},
  {c:"AAA", n:"Advanced Audit and Assurance (UK)"},
];
// new system; m = current paper whose result is credited
const NEW = [
  {lv:0, name:"Knowledge", sub:["시험 2027년 7월부터 · 모듈 2027년 초부터","Exams from Jul 2027 · module from early 2027"],
   award:"Higher Diploma in Accounting and Business", items:[
    {c:"K1", n:"Financial Accounting", m:"FA"},
    {c:"K2", n:"Management Accounting", m:"MA"},
    {c:"K3", n:"Business Law", m:"LW"},
    {mod:"RBM", n:"Responsible Business Management", m:"BT", credit:["Business and Technology (BT) 면제로 인정","Credited via the Business and Technology (BT) exemption"]},
  ]},
  {lv:1, name:"Expertise", sub:["시험 2027년 9월부터 · 모듈 2027년 7월부터","Exams from Sep 2027 · modules from Jul 2027"],
   award:"Advanced Diploma in Accounting and Business", items:[
    {c:"E1", n:"Taxation", m:"TX"},
    {c:"E2", n:"Financial Reporting", m:"FR"},
    {c:"E3", n:"Audit, Risk and Control", m:"AA"},
    {c:"E4", n:"Finance and Investment", m:"FM"},
    {c:"E5", n:"Performance with Data Analysis", m:"PM"},
    {mod:"DTI", n:"Digital Tech and Innovation", credit:["Applied Skills를 모두 마치면 이 모듈은 면제","Exempt once all Applied Skills are complete"]},
  ]},
  {lv:2, name:"Strategic Professional", sub:["시험 2027년 9월부터 · 모듈 2027년 7월부터","Exams from Sep 2027 · modules from Jul 2027"],
   award:["ACCA 회원 자격 (PER 완료 시)","ACCA membership (once PER is complete)"], items:[
    {c:"S1", n:"Business and Sustainability Reporting", m:"SBR"},
    {c:"S2", n:"Strategic Business Leader", m:"SBL"},
    {slot:0},
    {mod:"ESL", n:"Ethical, Sustainable Leadership", epsm:true, credit:["EPSM을 마치면 인정","Credited once EPSM is complete"]},
  ]},
];
const NEW_OPTS = [
  {c:"SCF", n:"Corporate Finance Professional", m:"AFM"},
  {c:"SPI", n:"Performance and Insights Professional", m:"APM"},
  {c:"STA", n:"Taxation Advisory Professional", m:"ATX"},
  {c:"SAA", n:"Audit and Assurance Professional", m:"AAA"},
  {c:"SDS", n:"Data Science Professional"},
];
const UNITS = [
  "Ethics and Professionalism","Personal Effectiveness","Communication and Interpersonal Skills",
  "Commercial Awareness","Leadership and Team Working","Innovation and Scepticism",
  "Data Analytics","Integrated Case Study","Strategic Professional Support","EPSM Final Assessment"
];
// one row per period; my = my tasks, sys = ACCA system changes. sub = finer date inside the period.

// ---- state ----
const DEFAULT = {papers:{}, options:["AFM",""], newOpt:"SCF", units:[], adv:[], view:"new"};
let state = structuredClone(DEFAULT);
function lsGet(){try{return JSON.parse(localStorage.getItem("acca-roadmap")||"null")}catch(e){return null}}
function lsSet(){try{localStorage.setItem("acca-roadmap",JSON.stringify(state))}catch(e){}}
function merge(d){
  state = Object.assign(structuredClone(DEFAULT), state, d||{});
  if(!Array.isArray(state.adv)) state.adv = [];
  if(!Array.isArray(state.options)) state.options = ["AFM",""];
  while(state.options.length<2) state.options.push("");
}
const ls = lsGet(); merge(ls);

const allCur = CUR.flatMap(l=>l.items).filter(i=>i.c);
const isExempt = c => !!allCur.find(p=>p.c===c && p.ex);
const st = c => state.papers[c] || "todo";            // todo | studying | passed
const curStatus = c => isExempt(c) ? "exempt" : st(c);
const epsmDone = () => state.units.length===UNITS.length;
const newOptObj = () => NEW_OPTS.find(o=>o.c===state.newOpt) || NEW_OPTS[0];
// status of the paper a new-system code depends on
const newKey = o => o.m || o.c;

// item status: exempt | passed | studying | todo  (done = exempt|passed)
function itemStatus(view, it){
  if(view==="cur"){
    if(it.mod) return epsmDone() ? "passed" : (state.units.length?"studying":"todo");
    if(it.slot!==undefined){ const c=state.options[it.slot]; return c?curStatus(c):"todo"; }
    return curStatus(it.c);
  }
  if(it.mod==="DTI") return CUR[1].items.every(i=>isDone(curStatus(i.c))) ? "exempt" : "todo";
  if(it.mod==="ESL") return epsmDone() ? "passed" : (state.units.length?"studying":"todo");
  if(it.mod) return curStatus(it.m)==="exempt" ? "exempt" : curStatus(it.m);
  if(it.slot!==undefined) return curStatus(newKey(newOptObj()));
  return curStatus(it.m);
}
const isDone = s => s==="exempt"||s==="passed";

function stats(view){
  const lv = view==="cur"?CUR:NEW;
  let total=0, done=0, exExam=0, pExam=0, sExam=0, nExam=0; const remaining=[];
  lv.forEach(l=>l.items.forEach(it=>{
    const s=itemStatus(view,it); total++; if(isDone(s)) done++;
    if(it.mod) return;
    nExam++;
    if(s==="exempt") exExam++; else if(s==="passed") pExam++;
    else { if(s==="studying") sExam++; remaining.push(it.slot!==undefined ? (view==="cur"?(state.options[it.slot]||t("선택과목","Option")):newOptObj().c) : it.c); }
  }));
  return {total,done,exExam,pExam,sExam,nExam,remaining};
}

const chip = s => ({
  exempt:`<span class="chip done">✓ ${t("면제 완료","Exempt")}</span>`,
  passed:`<span class="chip done">✓ ${t("합격","Passed")}</span>`,
  studying:`<span class="chip study">${t("공부 중","Studying")}</span>`,
  todo:`<span class="chip todo">${t("남음","To do")}</span>`,
}[s]);
const creditedChip = () => `<span class="chip done">✓ ${t("인정 완료","Credited")}</span>`;
function statusSelect(code, s){
  return `<select id="sel-${code}" data-code="${code}" class="${s}" aria-label="${code} ${t("상태","status")}">
    <option value="todo"${s==="todo"?" selected":""}>${t("남음","To do")}</option>
    <option value="studying"${s==="studying"?" selected":""}>${t("공부 중","Studying")}</option>
    <option value="passed"${s==="passed"?" selected":""}>${t("합격","Passed")}</option></select>`;
}
function card({tag, title, sub, s, control}){
  return `<div class="card ${isDone(s)?"done":""}">
    <span class="tag ${tag==="MODULE"?"mod":""}">${tag}</span>
    <div class="t">${title}</div>${sub?`<div class="s">${sub}</div>`:""}
    <div class="foot">${control||chip(s)}</div></div>`;
}

function renderCurCard(it){
  const s=itemStatus("cur",it);
  if(it.mod) return card({tag:"MODULE", title:`${it.mod} - ${it.n}`, sub:t("아래 윤리 섹션에서 유닛별로 체크","Tick off units in the Ethics section below"), s, control:epsmDone()?chip("passed"):`<span class="chip ${s==="studying"?"study":"todo"}">${state.units.length}/${UNITS.length} ${t("유닛","units")}</span>`});
  if(it.slot!==undefined){
    const c=state.options[it.slot], other=state.options[1-it.slot];
    const o=CUR_OPTS.find(x=>x.c===c);
    const sel=`<label class="optsel">${t("선택","Option")} ${it.slot+1}<select id="opt-cur-${it.slot}" data-optslot="${it.slot}" aria-label="${t("현행 선택과목","Current option")} ${it.slot+1}">
      <option value="">${t("고르기","Choose")}</option>${CUR_OPTS.filter(x=>x.c!==other).map(x=>`<option value="${x.c}"${x.c===c?" selected":""}>${x.c}</option>`).join("")}</select></label>`;
    return `<div class="card ${isDone(s)?"done":""} ${c?"":"dim"}"><span class="tag">EXAM</span>
      <div class="t">${o?`${o.c} - ${o.n}`:t("선택과목 (4개 중 고르기)","Option (choose from 4)")}</div><div class="s">${t("AFM · APM · ATX · AAA 중 2개","Pick 2 of AFM · APM · ATX · AAA")}</div>
      <div class="foot">${sel}${c?statusSelect(c,s):""}</div></div>`;
  }
  if(s==="exempt") return card({tag:"EXAM", title:`${it.c} - ${it.n}`, sub:it.cond?`${t("조건부 면제","Conditional exemption")}: ${it.cond}`:t("Exeter 학위로 면제","Exempt via Exeter degree"), s});
  return card({tag:"EXAM", title:`${it.c} - ${it.n}`, s, control:statusSelect(it.c,s)});
}

function renderNewCard(it){
  const s=itemStatus("new",it);
  if(it.mod){
    const ctrl = it.epsm && !epsmDone() ? `<span class="chip ${s==="studying"?"study":"todo"}">EPSM ${state.units.length}/${UNITS.length}</span>` : (isDone(s)?creditedChip():chip(s));
    return card({tag:"MODULE", title:`Essential Employability Module: ${it.n}`, sub:L(it.credit), s, control:ctrl});
  }
  if(it.slot!==undefined){
    const o=newOptObj(), k=newKey(o);
    const sel=`<label class="optsel">${t("옵션 변경","Change option")}<select id="opt-new" data-newopt="1" aria-label="${t("신규 선택과목","New option")}">${NEW_OPTS.map(x=>`<option value="${x.c}"${x.c===o.c?" selected":""}>${x.c}</option>`).join("")}</select></label>`;
    return `<div class="card ${isDone(s)?"done":""}"><span class="tag">EXAM</span>
      <div class="t">${o.c} - ${o.n}</div><div class="s">${o.m?t(`현행 ${o.m} 합격 시 인정`,`Credited if you pass current ${o.m}`):t("신규 과목 · 현행 대응 없음","New exam · no current equivalent")}</div>
      <div class="foot">${sel}${statusSelect(k,s)}</div></div>`;
  }
  const src = allCur.find(x=>x.c===it.m);
  const sub = `${t("인정 근거","Credited from")}: ${src.n} (${src.c})`;
  if(s==="exempt") return card({tag:"EXAM", title:`${it.c} - ${it.n}`, sub, s, control:creditedChip()});
  return card({tag:"EXAM", title:`${it.c} - ${it.n}`, sub, s, control:statusSelect(it.m,s)});
}

function renderView(){
  const v=state.view;
  $("tab-new").setAttribute("aria-selected", v==="new");
  $("tab-cur").setAttribute("aria-selected", v==="cur");
  let html = v==="new"
    ? `<div class="note">${t(
        `<b>바뀌는 점.</b> 시험은 13과목에서 11과목으로 줄고, 시험과 필수 직무역량 모듈(EEM)을 합쳐 14개 항목이 됩니다. BT는 폐지되어 Responsible Business Management 모듈로 인정되고, Strategic Professional 선택과목은 1개만 고릅니다. 이미 받은 면제와 합격은 그대로 이어집니다.`,
        `<b>What changes.</b> Exams drop from 13 to 11, and with the mandatory Essential Employability Modules (EEMs) there are 14 items in total. BT is retired and credited as the Responsible Business Management module, and you pick only 1 Strategic Professional option. Exemptions and passes you already have carry over.`)}</div>`
    : `<div class="note">${t(
        `<b>참고.</b> 면제는 2027년 졸업 후 확정되는데, 현행 Strategic Professional 시험은 2027년 6월이 마지막입니다. 그래서 남은 시험은 대부분 <b>신규 체계(선택 1과목)</b>로 보게 될 가능성이 높습니다.`,
        `<b>Note.</b> Exemptions are confirmed after graduating in 2027, but the last sitting of current Strategic Professional exams is June 2027. So most remaining exams will likely be taken under the <b>new syllabus (1 option)</b>.`)}</div>`;
  const levels = v==="new"?NEW:CUR;
  let cum=0, cumTotal=0;
  for(const l of levels){
    const sts = l.items.map(it=>itemStatus(v,it));
    const d = sts.filter(isDone).length;
    cum+=d; cumTotal+=l.items.length;
    let badge="";
    if(v==="new"){
      const got = cum===cumTotal;
      badge = `<div class="award ${got?"got":""}"><div><div class="a1">${got?t("취득 요건 충족","Requirements met"):t("완료하면 받을 수 있는 자격","Awarded on completion")}</div><div class="a2">${L(l.award)}</div></div><div class="score">${cum}/${cumTotal}</div></div>`;
    } else {
      const all = d===l.items.length;
      badge = `<div class="award ${all?"got":""}"><div><div class="a1">${t(`${l.items.length}개 항목`,`${l.items.length} items`)}</div><div class="a2">${all?t("이 단계 완료","Level complete"):t("진행 중","In progress")}</div></div><div class="score">${d}/${l.items.length}</div></div>`;
    }
    html += `<section class="panel" data-key="${v}-${l.lv}">
      <div class="phead"><h2><span class="lv">${L(BRACKET[l.lv])}</span>${l.name}</h2>${badge}${l.sub?`<span class="sub">${L(l.sub)}</span>`:""}</div>
      <div class="cards">${l.items.map(it=>v==="new"?renderNewCard(it):renderCurCard(it)).join("")}</div>
    </section>`;
  }
  $("view").innerHTML = html;
}

    ]],

      row(t("Applied Skills 전체","All Applied Skills"), "EEM Digital Tech and Innovation", lab("exempt")),
    ]],

      ...["SBR","SBL","AFM","APM","ATX","AAA"].map(c=>row(paper(c), target(c), lab(curStatus(c)))),
      row("—", `<b>SDS</b> Data Science Professional <span class="tsub">${t("신규 선택과목","New option")}</span>`, "—"),

function renderTimeline(){
  const ym = TODAY.getFullYear()+"-"+String(TODAY.getMonth()+1).padStart(2,"0");
  const today = fmtDate(TODAY), todayLbl = t("오늘","Today");
  $("today").textContent = todayLbl + " " + today;
  const item = x => `<div class="ti ${x.kind||""}">${x.sub?`<span class="sub2">${L(x.sub)}</span>`:""}<span class="tt">${L(x.t)}</span>${x.n?`<span class="tn">${L(x.n)}</span>`:""}</div>`;
  const cell = (list, who) => `<div class="tc" data-who="${who}">${list.length?list.map(item).join(""):'<span class="empty">—</span>'}</div>`;
  const todo = t("할 일","To do");
  const nowRow = `<div class="tr now"><span class="d">${todayLbl}</span><b>${today}</b></div>`;
  let html = `<div class="tr thead"><span></span><h3><span class="lv">[${todo}]</span>${t("내가 해야 할 것","What I need to do")}</h3><h3><span class="lv">[ACCA]</span>${t("체계 변경","Syllabus changes")}</h3></div>`;
  let placed = false;
  for(const r of T_ROWS){
    if(!placed && r.k >= ym){ html += nowRow; placed = true; }
    html += `<div class="tr ${r.k<ym?"past":""}"><span class="d">${L(r.d)}</span>${cell(r.my,todo)}${cell(r.sys,"ACCA")}</div>`;
  }
  if(!placed) html += nowRow;
  $("timeline").innerHTML = html;
}

let folded = new Set();
try{ folded = new Set(JSON.parse(localStorage.getItem("acca-folded")||"[]")); }catch(e){}
function decoratePanels(){
  document.querySelectorAll(".panel[data-key]").forEach(p=>{
    const k=p.dataset.key, head=p.querySelector(":scope > .phead");
    if(!head) return;
    let b=head.querySelector(":scope > .fold");
    if(!b){
      b=document.createElement("button");
      b.className="fold"; b.type="button"; b.dataset.fold=k;
      b.innerHTML='<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 9.5 7 4.5l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      const sub=head.querySelector(":scope > .sub");
      sub ? head.insertBefore(b, sub) : head.appendChild(b);
    }
    const c=folded.has(k);
    p.classList.toggle("collapsed", c);
    b.setAttribute("aria-expanded", String(!c));
    b.setAttribute("aria-label", (c?t("펼치기: ","Expand: "):t("접기: ","Collapse: "))+head.querySelector("h2").textContent);
  });
}

// ---- events ----
document.addEventListener("change", e=>{
  const t=e.target;
  if(t.dataset.code){ state.papers[t.dataset.code]=t.value; }
  else if(t.dataset.optslot!==undefined){ state.options[+t.dataset.optslot]=t.value; }
  else if(t.dataset.newopt){ state.newOpt=t.value; }
  else if(t.dataset.unit!==undefined){
    const i=+t.dataset.unit;
    state.units = t.checked ? [...new Set([...state.units,i])].sort((a,b)=>a-b) : state.units.filter(x=>x!==i);
  } else if(t.dataset.adv!==undefined){
    const i=+t.dataset.adv;
    state.adv = t.checked ? [...new Set([...state.adv,i])].sort((a,b)=>a-b) : state.adv.filter(x=>x!==i);
  } else return;
  const id=t.id; save(); renderAll(); document.getElementById(id)?.focus();
});
document.addEventListener("click", e=>{
  const lb=e.target.closest("[data-lang]");
  if(lb){
    lang=lb.dataset.lang;
    try{ localStorage.setItem("acca-lang", lang); }catch(err){}
    renderAll(); return;
  }
  const head=e.target.closest(".panel[data-key] > .phead:first-child");
  if(head && !e.target.closest("select,input,label,a")){
    const k=head.parentElement.dataset.key;
    folded.has(k) ? folded.delete(k) : folded.add(k);
    try{ localStorage.setItem("acca-folded", JSON.stringify([...folded])); }catch(err){}
    decoratePanels(); return;
  }
  if(e.target.id==="tab-cur"||e.target.id==="tab-new"){
    state.view = e.target.id==="tab-cur"?"cur":"new"; lsSet(); renderAll();
  }
});

// ---- persistence: account db with local fallback ----
let ref=null, timer=null;
function save(){
  lsSet();
  if(!ref) return;
  clearTimeout(timer);
  timer=setTimeout(async()=>{
    timer=null;
    try{ await ref.set({papers:state.papers, options:state.options, newOpt:state.newOpt, units:state.units, adv:state.adv, updatedAt:Date.now()}); setSync("saved"); }
    catch(err){ setSync("failed"); }
  },500);
}
renderAll();
(async()=>{
  try{
    const db = await window.claude?.use?.("db");
    const user = await window.claude?.use?.("user");
    const id = user ? await user.id() : null;
    if(!db || !id){ setSync("local"); return; }
    ref = db.doc(`data/users/${id}/acca`);
    // live: a change on any device shows up on every open device
    let first=true;
    ref.onSnapshot(snap=>{
      const d = snap.exists ? snap.data() : null;
      if(first){ first=false; if(!d && ls){ save(); } }
      if(d && !snap.metadata.hasPendingWrites && !timer){
        const focus=document.activeElement?.id;
        merge({papers:d.papers||{}, options:d.options||state.options, newOpt:d.newOpt||state.newOpt, units:d.units||[], adv:d.adv||[]});
        lsSet(); renderAll(); if(focus) document.getElementById(focus)?.focus();
      }
      setSync("live");
    }, ()=>{ setSync("lost"); });
  }catch(err){ setSync("local"); }
})();
